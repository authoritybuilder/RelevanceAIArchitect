<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#1A2540" />
  <meta name="description" content="A workspace for designing, scoping, and shipping AI agents on Relevance AI. Inspired by Wei Li's methodology." />
  <meta property="og:title" content="Agent Architect" />
  <meta property="og:description" content="A workspace for designing, scoping, and shipping AI agents." />
  <meta property="og:type" content="website" />
  <title>Agent Architect</title>
  <style>
    html, body, #root {
      margin: 0;
      padding: 0;
      min-height: 100vh;
      background: #FAFAF7;
      font-family: -apple-system, BlinkMacSystemFont, "Inter", system-ui, sans-serif;
    }
    #pa-loader {
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 18px;
      background: #FAFAF7;
      z-index: 9999;
      transition: opacity 0.3s ease;
    }
    #pa-loader.hidden {
      opacity: 0;
      pointer-events: none;
    }
    .pa-loader-mark {
      width: 56px;
      height: 56px;
      border-radius: 16px;
      background: linear-gradient(135deg, #1A2540 0%, #4A6FA5 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      color: #FFFFFF;
      font-family: Georgia, serif;
      font-weight: 900;
      font-size: 22px;
      box-shadow: 0 8px 24px rgba(26, 37, 64, 0.25);
    }
    .pa-loader-text {
      font-size: 12px;
      letter-spacing: 0.18em;
      font-weight: 700;
      color: #6B7280;
      text-transform: uppercase;
    }
    .pa-loader-sub {
      font-size: 11px;
      color: #9CA3AF;
      font-family: "JetBrains Mono", "Courier New", monospace;
    }
    .pa-loader-dot {
      display: inline-block;
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: #4A6FA5;
      margin: 0 3px;
      animation: pa-bounce 1.4s infinite ease-in-out both;
    }
    .pa-loader-dot:nth-child(1) { animation-delay: -0.32s; }
    .pa-loader-dot:nth-child(2) { animation-delay: -0.16s; }
    @keyframes pa-bounce {
      0%, 80%, 100% { transform: scale(0); }
      40% { transform: scale(1); }
    }
    .pa-error {
      max-width: 540px;
      margin: 80px auto;
      padding: 24px;
      font-family: -apple-system, BlinkMacSystemFont, "Inter", sans-serif;
      color: #1A2540;
      line-height: 1.55;
    }
    .pa-error-eyebrow {
      font-size: 11px;
      letter-spacing: 0.18em;
      font-weight: 700;
      color: #DC3545;
      margin-bottom: 8px;
    }
    .pa-error-title {
      font-size: 20px;
      font-weight: 700;
      margin-bottom: 12px;
    }
    .pa-error-body {
      font-size: 14px;
      color: #6B7280;
      margin-bottom: 14px;
    }
    .pa-error-detail {
      font-size: 12px;
      color: #6B7280;
      background: #F4F4F0;
      border-radius: 6px;
      padding: 12px;
      font-family: "JetBrains Mono", "Courier New", monospace;
      white-space: pre-wrap;
      word-break: break-all;
    }
  </style>
</head>
<body>
  <div id="pa-loader" role="status" aria-live="polite" aria-label="Loading Agent Architect">
    <div class="pa-loader-mark">PA</div>
    <div class="pa-loader-text">Agent Architect</div>
    <div>
      <span class="pa-loader-dot"></span>
      <span class="pa-loader-dot"></span>
      <span class="pa-loader-dot"></span>
    </div>
    <div class="pa-loader-sub">loading workspace</div>
  </div>

  <div id="root"></div>

  <!--
    localStorage shim for window.storage. The artefact source was built
    for Claude.ai's storage API. On any other host, we mirror the API
    to localStorage so persistence works the same way.
  -->
  <script>
    (function () {
      if (typeof window === "undefined" || window.storage) return;
      window.storage = {
        get: function (key) {
          return Promise.resolve().then(function () {
            var value = localStorage.getItem(key);
            return value === null ? null : { key: key, value: value, shared: false };
          });
        },
        set: function (key, value, shared) {
          return Promise.resolve().then(function () {
            localStorage.setItem(key, value);
            return { key: key, value: value, shared: !!shared };
          });
        },
        delete: function (key, shared) {
          return Promise.resolve().then(function () {
            var existed = localStorage.getItem(key) !== null;
            localStorage.removeItem(key);
            return { key: key, deleted: existed, shared: !!shared };
          });
        },
        list: function (prefix, shared) {
          return Promise.resolve().then(function () {
            var keys = [];
            for (var i = 0; i < localStorage.length; i++) {
              var key = localStorage.key(i);
              if (!prefix || (key && key.indexOf(prefix) === 0)) keys.push(key);
            }
            return { keys: keys, prefix: prefix || "", shared: !!shared };
          });
        }
      };
    })();
  </script>

  <!-- Catch any error in the application script and show it to the user -->
  <script>
    window.addEventListener("error", function (e) {
      var loader = document.getElementById("pa-loader");
      if (loader) loader.style.display = "none";
      var root = document.getElementById("root");
      if (root && !root.firstChild) {
        root.innerHTML =
          '<div class="pa-error">' +
            '<div class="pa-error-eyebrow">SOMETHING BROKE</div>' +
            '<div class="pa-error-title">Agent Architect failed to load.</div>' +
            '<div class="pa-error-body">This usually means the JavaScript bundle didn\'t load, or there was a runtime error. Open your browser\'s console (F12) for the actual error message.</div>' +
            '<div class="pa-error-detail">' + (e.message || "Unknown error") + (e.filename ? "\n\n" + e.filename + ":" + e.lineno : "") + '</div>' +
          '</div>';
      }
    });
  </script>

  <!-- React 18, UMD build, from unpkg CDN -->
  <script crossorigin src="https://unpkg.com/react@18.2.0/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18.2.0/umd/react-dom.production.min.js"></script>

  <!-- The pre-transformed application code (no build step needed) -->
  <script src="agent-architect.js"></script>
</body>
</html>
